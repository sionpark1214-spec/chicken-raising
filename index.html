<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치킨 키우기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #87CEEB;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }
        #game {
            width: 100%; height: 100vh; position: relative;
            background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 40%, #7BC043 40%, #5a9e2f 100%);
        }

        /* 상단 바 */
        #top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-around;
            padding: 8px 6px; background: rgba(0,0,0,0.35);
            color: #fff; font-size: 13px; font-weight: bold; z-index: 100;
        }
        .resource { display: flex; align-items: center; gap: 3px; }
        .resource-icon { font-size: 16px; }

        /* 울타리 */
        #pen {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 8px;
            background: #8fbe3f;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: width 0.5s, height 0.5s;
            overflow: visible;
        }
        #pen-inner {
            position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
            background: #a0d44a;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.08);
        }
        #pen-inner::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.04) 0%, transparent 30%);
        }
        /* 울타리 기둥들 */
        .fence-post {
            position: absolute;
            width: 8px; height: 20px;
            background: linear-gradient(90deg, #a0713a, #c4944a, #a0713a);
            border-radius: 2px 2px 0 0;
            z-index: 5;
        }
        .fence-post.top { top: -12px; }
        .fence-post.bottom { bottom: -12px; }
        .fence-post.left { width: 20px; height: 8px; border-radius: 2px 0 0 2px; }
        .fence-post.right { width: 20px; height: 8px; border-radius: 0 2px 2px 0; }
        .fence-rail-h {
            position: absolute; left: 0; right: 0; height: 4px;
            background: linear-gradient(180deg, #c4944a, #8B6331);
            z-index: 4;
        }
        .fence-rail-h.top-rail { top: -4px; }
        .fence-rail-h.bot-rail { bottom: -4px; }
        .fence-rail-v {
            position: absolute; top: 0; bottom: 0; width: 4px;
            background: linear-gradient(90deg, #c4944a, #8B6331);
            z-index: 4;
        }
        .fence-rail-v.left-rail { left: -4px; }
        .fence-rail-v.right-rail { right: -4px; }

        #pen-label {
            position: absolute; top: -26px; left: 50%;
            transform: translateX(-50%);
            background: #6d4c1a; color: #fff;
            padding: 2px 14px; border-radius: 8px 8px 0 0;
            font-size: 11px; font-weight: bold; white-space: nowrap; z-index: 6;
        }

        /* 닭 */
        .chicken {
            position: absolute; transition: none;
            cursor: pointer; z-index: 10;
        }
        .chicken .body {
            display: block; line-height: 0;
            animation: bob 0.8s ease-in-out infinite;
            transition: filter 0.5s;
        }
        .chicken .body svg { display: block; }
        .chicken.egg .body svg { width: 20px; height: 26px; }
        .chicken.egg .body { animation: wobble 2s ease-in-out infinite; }
        .chicken.chick .body svg { width: 30px; height: 30px; }
        .chicken.young .body svg { width: 38px; height: 38px; }
        .chicken.adult .body svg { width: 48px; height: 48px; }
        .chicken.sleeping .body { animation: sleepBob 2s ease-in-out infinite; }

        .chicken .needs {
            position: absolute; top: -18px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 1px; font-size: 11px;
            white-space: nowrap;
        }
        .need-icon { animation: pulse 1s ease-in-out infinite; }

        .chicken .bars {
            position: absolute; bottom: -12px; left: 50%;
            transform: translateX(-50%); width: 32px;
        }
        .bar { width: 100%; height: 3px; background: rgba(0,0,0,0.25); border-radius: 2px; margin-bottom: 1px; }
        .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

        .chicken.dying .body { animation: shake 0.3s ease-in-out infinite; }

        /* 고양이 */
        .cat {
            position: absolute; z-index: 15; cursor: pointer;
            transition: none;
        }
        .cat svg { width: 40px; height: 40px; }
        .cat .cat-hp {
            position: absolute; top: -8px; left: 50%;
            transform: translateX(-50%); width: 30px; height: 3px;
            background: rgba(0,0,0,0.3); border-radius: 2px;
        }
        .cat .cat-hp-fill { height: 100%; background: #f44336; border-radius: 2px; transition: width 0.2s; }
        .cat.hit { animation: catHit 0.2s ease; }

        @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
        @keyframes sleepBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
        @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(5deg)} 75%{transform:rotate(-5deg)} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }
        @keyframes deathFade {
            0%{opacity:1;transform:translateY(0) scale(1)}
            50%{opacity:0.6;transform:translateY(-10px) scale(1.2)}
            100%{opacity:0;transform:translateY(-40px) scale(0.3)}
        }
        @keyframes catHit { 0%{transform:scale(1)} 50%{transform:scale(0.85)} 100%{transform:scale(1)} }
        @keyframes catFlee {
            0%{opacity:1;transform:translateX(0)} 100%{opacity:0;transform:translateX(120px)}
        }
        @keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
        @keyframes zzzFloat {
            0%{opacity:0;transform:translate(0,0) scale(0.5)}
            30%{opacity:1}
            100%{opacity:0;transform:translate(10px,-20px) scale(1.2)}
        }

        .float-text {
            position: absolute; font-weight: bold; font-size: 15px;
            pointer-events: none; z-index: 200;
            animation: floatUp 1.2s ease-out forwards;
        }
        .zzz {
            position: absolute; font-size: 14px; pointer-events: none; z-index: 20;
            animation: zzzFloat 2s ease-out infinite;
            color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* 하단 버튼 */
        #bottom-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            display: flex; gap: 4px; padding: 8px 6px;
            justify-content: center; flex-wrap: wrap;
            background: rgba(0,0,0,0.35); z-index: 100;
        }
        .btn {
            padding: 8px 10px; border: none; border-radius: 8px;
            font-size: 12px; font-weight: bold; cursor: pointer; color: #fff;
            display: flex; align-items: center; gap: 3px;
            transition: transform 0.1s;
            box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0.3); }
        .btn .price { font-size: 10px; opacity: 0.8; }
        .btn-buy { background: #E91E63; }
        .btn-water { background: #2196F3; }
        .btn-worm { background: #8D6E63; }
        .btn-berry { background: #AB47BC; }
        .btn-fish { background: #00897B; }
        .btn-collect { background: #9C27B0; }
        .btn-upgrade { background: #4CAF50; }
        .btn-sell { background: #795548; }
        .btn-code { background: #607D8B; }

        /* 메시지 */
        #message {
            position: absolute; top: 46px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 6px 14px; border-radius: 20px;
            font-size: 13px; z-index: 200; opacity: 0;
            transition: opacity 0.3s; white-space: nowrap;
        }
        #message.show { opacity: 1; }

        /* 코드 모달 */
        #code-modal {
            display: none; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 400;
            justify-content: center; align-items: center;
        }
        #code-modal.show { display: flex; }
        #code-box {
            background: #fff; border-radius: 16px;
            padding: 20px; text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3); min-width: 260px;
        }
        #code-box h3 { margin-bottom: 10px; font-size: 16px; color: #333; }
        #code-input {
            width: 100%; padding: 8px 12px;
            border: 2px solid #ddd; border-radius: 8px;
            font-size: 15px; text-align: center; outline: none; margin-bottom: 10px;
        }
        #code-input:focus { border-color: #607D8B; }
        .code-btns { display: flex; gap: 8px; justify-content: center; }
        .code-btn {
            padding: 7px 18px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: bold; cursor: pointer; color: #fff;
        }
        .code-btn-ok { background: #4CAF50; }
        .code-btn-cancel { background: #999; }

        /* 배경 장식 */
        #sun { position: absolute; top: 25px; right: 35px; font-size: 45px; animation: sunPulse 3s ease-in-out infinite; z-index: 1; }
        @keyframes sunPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
        .cloud { position: absolute; font-size: 35px; opacity: 0.6; z-index: 1; animation: drift 20s linear infinite; }
        @keyframes drift { 0%{transform:translateX(-100px)} 100%{transform:translateX(calc(100vw + 100px))} }

        /* 시작 화면 */
        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #FFB347 0%, #FF6B6B 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 500;
        }
        #start-screen h1 { font-size: 44px; color: #fff; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); margin-bottom: 8px; }
        #start-screen .subtitle { color: rgba(255,255,255,0.8); font-size: 15px; margin-bottom: 25px; }
        #start-screen .chickens-anim { font-size: 55px; margin-bottom: 25px; animation: bob 1s ease-in-out infinite; }
        #start-btn {
            padding: 14px 44px; font-size: 20px; font-weight: bold;
            border: none; border-radius: 14px; background: #fff; color: #FF6B6B;
            cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.15);
        }
        #start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }

        /* 고양이 경고 */
        #cat-warning {
            display: none; position: absolute; top: 70px; left: 50%;
            transform: translateX(-50%);
            background: rgba(200,0,0,0.8); color: #fff;
            padding: 5px 14px; border-radius: 12px;
            font-size: 13px; font-weight: bold; z-index: 150;
            animation: pulse 0.8s ease-in-out infinite;
        }
        #cat-warning.show { display: block; }
    </style>
</head>
<body>
<div id="game">
    <div id="start-screen">
        <div class="chickens-anim">🐔🐣🥚</div>
        <h1>치킨 키우기</h1>
        <p class="subtitle">병아리부터 키워 나만의 농장을 만들자!</p>
        <button id="start-btn">게임 시작</button>
    </div>

    <div id="sun">☀️</div>
    <div class="cloud" style="top:55px;left:-50px;animation-duration:25s;">☁️</div>
    <div class="cloud" style="top:90px;left:-150px;animation-duration:35s;animation-delay:5s;">☁️</div>
    <div class="cloud" style="top:35px;left:-200px;animation-duration:30s;animation-delay:12s;">☁️</div>

    <div id="top-bar">
        <div class="resource"><span class="resource-icon">💰</span><span id="money">0</span></div>
        <div class="resource"><span class="resource-icon">🐔</span><span id="count">0</span>/<span id="max-count">4</span></div>
        <div class="resource"><span class="resource-icon">🥚</span><span id="eggs">0</span></div>
        <div class="resource"><span class="resource-icon">😺</span><span id="cat-kills">0</span></div>
    </div>

    <div id="pen">
        <div id="pen-label">울타리 Lv.1</div>
        <div class="fence-rail-h top-rail"></div>
        <div class="fence-rail-h bot-rail"></div>
        <div class="fence-rail-v left-rail"></div>
        <div class="fence-rail-v right-rail"></div>
        <div id="pen-inner"></div>
    </div>

    <div id="message"></div>
    <div id="cat-warning">🐱 고양이가 나타났다! 터치해서 쫓아내세요!</div>

    <div id="bottom-bar">
        <button class="btn btn-buy" onclick="buyChick()">🐣 병아리<span class="price">(100)</span></button>
        <button class="btn btn-water" onclick="giveWater()">💧 물<span class="price">(20)</span></button>
        <button class="btn btn-worm" onclick="giveWorm()">🐛 벌레<span class="price">(30)</span></button>
        <button class="btn btn-berry" onclick="giveBerry()">🫐 열매<span class="price">(50)</span></button>
        <button class="btn btn-fish" onclick="giveFish()">🐟 생선<span class="price">(80)</span></button>
        <button class="btn btn-collect" onclick="collectEggs()">🥚 수집</button>
        <button class="btn btn-sell" onclick="sellEggs()">🥚 팔기<span class="price">(80)</span></button>
        <button class="btn btn-upgrade" onclick="upgradePen()">🔨 확장</button>
        <button class="btn btn-code" onclick="openCodeModal()">🔑 코드</button>
    </div>

    <div id="code-modal">
        <div id="code-box">
            <h3>🔑 코드 입력</h3>
            <input type="text" id="code-input" placeholder="코드를 입력하세요" autocomplete="off">
            <div class="code-btns">
                <button class="code-btn code-btn-ok" onclick="submitCode()">확인</button>
                <button class="code-btn code-btn-cancel" onclick="closeCodeModal()">취소</button>
            </div>
        </div>
    </div>
</div>

<script>
// ===== SVG 그래픽 =====
function chickenSVG(stage) {
    switch(stage) {
        case 'egg': return `<svg viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="20" cy="29" rx="15" ry="19" fill="#FFF5E0" stroke="#C9A84C" stroke-width="1.2"/>

        case 'young': return `<svg viewBox="0 0 58 62" xmlns="http://www.w3.org/2000/svg">

            <circle cx="32.3" cy="17" r="0.9" fill="#fff"/>
            <path d="M25,23 L27,28 L29,23" fill="#E65100" stroke="#BF360C" stroke-width="0.5"/>

        case 'adult': return `<svg viewBox="0 0 65 68" xmlns="http://www.w3.org/2000/svg">

            <path d="M28,23 L30,29 L32,23" fill="#E65100" stroke="#BF360C" stroke-width="0.6"/>

            <ellipse cx="30" cy="32" rx="3" ry="4" fill="#D32F2F"/>
            <ellipse cx="30" cy="33" rx="2" ry="2.5" fill="#E53935"/>

            <path d="M9,36 Q12,40 9,44" stroke="#BCAAA4" fill="none" stroke-width="0.8"/>
            <path d="M11,38 Q13,41 11,44" stroke="#BCAAA4" fill="none" stroke-width="0.5"/>
            <ellipse cx="48" cy="42" rx="7" ry="12" fill="#D7CCC8" transform="rotate(8 48 42)"/>

// ===== 게임 상수 =====
const STAGES = {
    egg:   { name:'알',     growTime:10000, nextStage:'chick' },
    chick: { name:'병아리', growTime:20000, nextStage:'young' },
    young: { name:'중병아리', growTime:30000, nextStage:'adult' },
    adult: { name:'성닭',   growTime:null,  nextStage:null }
};

const penSizes = [
    { w: 300, h: 220, max: 5 },
    { w: 380, h: 280, max: 10 },
    { w: 460, h: 340, max: 16 },
    { w: 540, h: 400, max: 24 },
    { w: 620, h: 460, max: 34 },
];
const penUpgradeCost = [0, 400, 1000, 2500, 6000];

let state = { money:700, storedEggs:0, penLevel:1, chickens:[], nextId:0, catKills:0 };
let gameStarted = false;
let msgTimer = null;
let cats = [];
let catSpawnTimer = 0;

function getPenConfig() { return penSizes[Math.min(state.penLevel-1, penSizes.length-1)]; }

// ===== UI 헬퍼 =====
function showMsg(t) {
    const el = document.getElementById('message');
    el.textContent = t; el.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function floatText(x, y, text, color='#fff') {
    const el = document.createElement('div');
    el.className = 'float-text'; el.textContent = text;
    el.style.left = x+'px'; el.style.top = y+'px'; el.style.color = color;
    document.getElementById('game').appendChild(el);
    setTimeout(() => el.remove(), 1200);
}

function buildFence() {
    const pen = document.getElementById('pen');
    pen.querySelectorAll('.fence-post').forEach(p => p.remove());
    const cfg = getPenConfig();
    const postCount = Math.floor(cfg.w / 30);
    for (let i = 0; i <= postCount; i++) {
        const x = (i / postCount) * (cfg.w - 8);
        ['top','bottom'].forEach(side => {
            const post = document.createElement('div');
            post.className = `fence-post ${side}`;
            post.style.left = x + 'px';
            pen.appendChild(post);
        });
    }
    const vPostCount = Math.floor(cfg.h / 30);
    for (let i = 0; i <= vPostCount; i++) {
        const y = (i / vPostCount) * (cfg.h - 8);
        ['left','right'].forEach(side => {
            const post = document.createElement('div');
            post.className = `fence-post ${side}`;
            post.style.top = y + 'px';
            if (side === 'left') post.style.left = '-12px';
            else post.style.right = '-12px';
            pen.appendChild(post);
        });
    }
}

function updateUI() {
    document.getElementById('money').textContent = state.money;
    document.getElementById('eggs').textContent = state.storedEggs;
    document.getElementById('cat-kills').textContent = state.catKills;
    const cfg = getPenConfig();
    document.getElementById('count').textContent = state.chickens.length;
    document.getElementById('max-count').textContent = cfg.max;
    const pen = document.getElementById('pen');
    pen.style.width = cfg.w+'px'; pen.style.height = cfg.h+'px';
    document.getElementById('pen-label').textContent =
        `울타리 Lv.${state.penLevel} (${state.chickens.length}/${cfg.max})`;
}

// ===== 닭 관리 =====
function addChickenEl(c) {
    const el = document.createElement('div');
    el.className = `chicken ${c.stage}`;
    el.id = `chicken-${c.id}`;
    el.style.left = c.x+'px'; el.style.top = c.y+'px';
    el.innerHTML = `
        <div class="needs"></div>
        <span class="body">${chickenSVG(c.stage)}</span>
        <div class="bars">
            <div class="bar"><div class="bar-fill" data-bar="growth" style="width:0%;background:#4CAF50"></div></div>
            <div class="bar"><div class="bar-fill" data-bar="hp" style="width:100%;background:#f44336"></div></div>
        </div>
    `;
    el.addEventListener('click', () => onClickChicken(c.id));
    document.getElementById('pen-inner').appendChild(el);
}

function createChicken(stage, x, y) {
    const cfg = getPenConfig();
    const innerW = cfg.w - 16, innerH = cfg.h - 16;
    const id = state.nextId++;
    const c = {
        id, stage,
        x: x ?? Math.random()*(innerW-50)+5,
        y: y ?? Math.random()*(innerH-50)+5,
        hunger:100, thirst:100, hp:100, energy:100,
        growth:0, eggTimer:0,
        vx:(Math.random()-0.5)*0.6, vy:(Math.random()-0.5)*0.6,
        layReady:false, fromHen:false, sleeping:false, collisionCd:0
    };
    state.chickens.push(c);
    addChickenEl(c);
    return c;
}

function onClickChicken(id) {
    const c = state.chickens.find(ch => ch.id===id);
    if (!c) return;
    const info = STAGES[c.stage];
    let s = `${info.name}`;
    if (c.stage!=='adult' && STAGES[c.stage].growTime) s += ` 성장:${Math.floor(c.growth)}%`;
    s += ` ❤️${Math.floor(c.hp)} 🍗${Math.floor(c.hunger)} 💧${Math.floor(c.thirst)} ⚡${Math.floor(c.energy)}`;
    if (c.sleeping) s += ' 💤자는중';
    if (c.layReady) s += ' 🥚알!';
    showMsg(s);
}

// ===== 먹이 / 물 =====
function feedChickens(cost, hungerAdd, thirstAdd, growBonus, foodName) {
    if (state.money < cost) return showMsg('돈이 부족합니다!');
    const targets = state.chickens.filter(c => c.stage!=='egg' && (c.hunger<80 || c.thirst<80));
    if (targets.length===0) return showMsg('배고프거나 목마른 닭이 없습니다!');
    state.money -= cost;
    const count = Math.min(3, targets.length);
    for (let i=0; i<count; i++) {
        const t = targets[i];
        t.hunger = Math.min(100, t.hunger + hungerAdd);
        t.thirst = Math.min(100, t.thirst + thirstAdd);
        if (growBonus && STAGES[t.stage].growTime) t.growth = Math.min(100, t.growth + growBonus);
        if (t.sleeping && t.energy > 30) { t.sleeping = false; }
        const el = document.getElementById(`chicken-${t.id}`);
        if (el) {
            const r = el.getBoundingClientRect();
            floatText(r.left, r.top-10, foodName, '#4CAF50');
        }
    }
    showMsg(`${foodName} ${count}마리에게 줬습니다!`);
    updateUI();
}

function giveWater() { feedChickens(20, 0, 45, 0, '💧'); }
function giveWorm() { feedChickens(30, 35, 0, 2, '🐛'); }
function giveBerry() { feedChickens(50, 30, 15, 5, '🫐'); }
function giveFish() { feedChickens(80, 50, 10, 8, '🐟'); }

function buyChick() {
    if (state.money<100) return showMsg('돈이 부족합니다!');
    const cfg = getPenConfig();
    if (state.chickens.length>=cfg.max) return showMsg('울타리가 꽉 찼습니다!');
    state.money -= 100;
    createChicken('chick');
    showMsg('🐣 병아리를 샀습니다!');
    updateUI();
}

function collectEggs() {
    const layers = state.chickens.filter(c => c.layReady);
    if (layers.length===0) return showMsg('수집할 알이 없습니다!');
    let count=0;
    layers.forEach(c => {
        c.layReady=false; c.eggTimer=0; count++;
        const cfg = getPenConfig();
        if (state.chickens.length < cfg.max && Math.random()<0.5) {
            const egg = createChicken('egg', c.x+10, c.y+10);
            egg.fromHen = true;
        } else { state.storedEggs++; }
    });
    showMsg(`🥚 알 ${count}개 수집!`);
    updateUI();
}

function sellEggs() {
    if (state.storedEggs<=0) return showMsg('팔 알이 없습니다!');
    const earn = state.storedEggs*80;
    state.money += earn;
    showMsg(`🥚 ${state.storedEggs}개 → ${earn}원!`);
    state.storedEggs=0;
    updateUI();
}

function upgradePen() {
    if (state.penLevel>=penSizes.length) return showMsg('최대 레벨!');
    const cost = penUpgradeCost[state.penLevel];
    if (state.money<cost) return showMsg(`${cost}원 필요!`);
    state.money -= cost;
    state.penLevel++;
    buildFence();
    showMsg(`🔨 울타리 Lv.${state.penLevel}!`);
    updateUI();
}

// ===== 고양이 =====
function spawnCat() {
    const cfg = getPenConfig();
    const innerW = cfg.w-16, innerH = cfg.h-16;
    const side = Math.floor(Math.random()*4);
    let x,y;
    if (side===0) { x=-30; y=Math.random()*innerH; }
    else if (side===1) { x=innerW+10; y=Math.random()*innerH; }
    else if (side===2) { x=Math.random()*innerW; y=-30; }
    else { x=Math.random()*innerW; y=innerH+10; }

    const cat = { id: Date.now(), x, y, clickHp:15, maxHp:15 };
    cats.push(cat);

    const el = document.createElement('div');
    el.className = 'cat'; el.id = `cat-${cat.id}`;
    el.style.left = x+'px'; el.style.top = y+'px';
    el.innerHTML = `<div class="cat-hp"><div class="cat-hp-fill" style="width:100%"></div></div>${catSVG()}`;
    el.addEventListener('click', (e) => {
        e.stopPropagation();
        hitCat(cat.id);
    });
    document.getElementById('pen-inner').appendChild(el);
    document.getElementById('cat-warning').classList.add('show');
}

function hitCat(id) {
    const cat = cats.find(c => c.id===id);
    if (!cat) return;
    cat.clickHp--;
    const el = document.getElementById(`cat-${id}`);
    if (el) {
        el.classList.remove('hit');
        void el.offsetWidth;
        el.classList.add('hit');
        const hpFill = el.querySelector('.cat-hp-fill');
        hpFill.style.width = (cat.clickHp/cat.maxHp*100)+'%';
        const r = el.getBoundingClientRect();
        floatText(r.left, r.top-10, '👊', '#FF5722');
    }
    if (cat.clickHp <= 0) {
        if (el) {
            el.style.animation = 'catFlee 0.8s ease-in forwards';
            el.style.pointerEvents = 'none';
            setTimeout(() => el.remove(), 800);
        }
        cats = cats.filter(c => c.id!==id);
        state.catKills++;
        state.money += 50;
        showMsg('🐱 고양이를 쫓아냈다! +50원!');
        if (cats.length===0) document.getElementById('cat-warning').classList.remove('show');
        updateUI();
    }
}

// ===== 게임 루프 =====
function gameLoop() {
    if (!gameStarted) return;
    const dt = 100;
    const cfg = getPenConfig();
    const innerW = cfg.w-16, innerH = cfg.h-16;
    const toRemove = [];

    // 고양이 스폰
    catSpawnTimer += dt;
    if (catSpawnTimer > 30000 + Math.random()*30000 && state.chickens.length > 0 && cats.length < 2) {
        spawnCat();
        catSpawnTimer = 0;
    }

    // 고양이 이동 + 공격
    cats.forEach(cat => {
        let nearest = null, nearDist = Infinity;
        state.chickens.forEach(c => {
            if (c.stage==='egg') return;
            const d = Math.hypot(c.x-cat.x, c.y-cat.y);
            if (d < nearDist) { nearDist=d; nearest=c; }
        });
        if (nearest) {
            const dx = nearest.x-cat.x, dy = nearest.y-cat.y;
            const dist = Math.hypot(dx,dy);
            if (dist > 5) {
                cat.x += (dx/dist)*0.4;
                cat.y += (dy/dist)*0.4;
            }
            if (dist < 20) {
                nearest.hp = Math.max(0, nearest.hp-0.1);
            }
        }
        const el = document.getElementById(`cat-${cat.id}`);
        if (el) { el.style.left=cat.x+'px'; el.style.top=cat.y+'px'; }
    });

    state.chickens.forEach(c => {
        if (c.collisionCd > 0) c.collisionCd -= dt;

        // 수면 처리
        if (c.stage !== 'egg') {
            c.energy = Math.max(0, c.energy - 0.005);
            if (c.energy < 10 && !c.sleeping) {
                c.sleeping = true;
                c.vx = 0; c.vy = 0;
            }
            if (c.sleeping) {
                c.energy = Math.min(100, c.energy + 0.025);
                if (c.energy > 85) c.sleeping = false;
            }
        }

        // 이동
        if (c.stage !== 'egg' && !c.sleeping) {
            const spd = c.hp < 30 ? 0.3 : (c.hunger < 20 || c.thirst < 20) ? 0.5 : 1;
            if (Math.random() < 0.02) {
                c.vx = (Math.random()-0.5)*1.0*spd;
                c.vy = (Math.random()-0.5)*1.0*spd;
            }
            c.x += c.vx*spd; c.y += c.vy*spd;
            c.x = Math.max(3, Math.min(innerW-48, c.x));
            c.y = Math.max(3, Math.min(innerH-55, c.y));
            if (c.x<=3||c.x>=innerW-48) c.vx*=-1;
            if (c.y<=3||c.y>=innerH-55) c.vy*=-1;
        }

        // 충돌 체크
        if (c.stage!=='egg' && c.collisionCd<=0) {
            state.chickens.forEach(other => {
                if (other.id===c.id || other.stage==='egg' || other.collisionCd>0) return;
                const dist = Math.hypot(c.x-other.x, c.y-other.y);
                if (dist < 18) {
                    c.hp = Math.max(0, c.hp-1.5);
                    other.hp = Math.max(0, other.hp-1.5);
                    c.collisionCd = 2000; other.collisionCd = 2000;
                    const dx = c.x-other.x, dy = c.y-other.y;
                    const nd = Math.hypot(dx,dy) || 1;
                    c.vx = (dx/nd)*1.5; c.vy = (dy/nd)*1.5;
                    other.vx = -(dx/nd)*1.5; other.vy = -(dy/nd)*1.5;
                    const el = document.getElementById(`chicken-${c.id}`);
                    if (el) { const r=el.getBoundingClientRect(); floatText(r.left,r.top-10,'💥','#FF5722'); }
                }
            });
        }

        // 허기/갈증
        if (c.stage !== 'egg') {
            c.hunger = Math.max(0, c.hunger - 0.008);
            c.thirst = Math.max(0, c.thirst - 0.01);
        }

        // HP
        if (c.stage !== 'egg') {
            let hpLoss = 0;
            if (c.hunger<=0) hpLoss += 0.004;
            if (c.thirst<=0) hpLoss += 0.004;
            if (hpLoss>0) c.hp = Math.max(0, c.hp-hpLoss);
            else if (c.hunger>50 && c.thirst>50) c.hp = Math.min(100, c.hp+0.002);
        }

        // 죽음
        if (c.hp<=0 && c.stage!=='egg') {
            const el = document.getElementById(`chicken-${c.id}`);
            if (el) {
                el.style.animation='deathFade 1s ease-out forwards';
                el.style.pointerEvents='none';
                const r=el.getBoundingClientRect();
                floatText(r.left,r.top-20,'💀','#f44336');
                setTimeout(()=>el.remove(),1000);
            }
            toRemove.push(c.id);
            return;
        }

        // 성장
        const si = STAGES[c.stage];
        if (si.growTime && c.hunger>20 && c.thirst>20 && !c.sleeping) {
            c.growth += (dt/si.growTime)*100;
            if (c.growth>=100) {
                c.stage=si.nextStage; c.growth=0; c.hp=100; c.energy=100;
                const el=document.getElementById(`chicken-${c.id}`);
                if (el) {
                    el.className=`chicken ${c.stage}`;
                    el.querySelector('.body').innerHTML=chickenSVG(c.stage);
                    const r=el.getBoundingClientRect();
                    floatText(r.left,r.top-20,'⬆️ 성장!','#FFD700');
                }
            }
        }

        // 알 낳기
        if (c.stage==='adult' && !c.layReady && c.hunger>30 && c.thirst>30 && c.hp>30 && !c.sleeping) {
            c.eggTimer += dt;
            if (c.eggTimer>=15000) {
                c.layReady=true;
                const el=document.getElementById(`chicken-${c.id}`);
                if (el) { const r=el.getBoundingClientRect(); floatText(r.left,r.top-20,'🥚','#9C27B0'); }
            }
        }

        // 비주얼 업데이트
        const el = document.getElementById(`chicken-${c.id}`);
        if (!el) return;
        el.style.left=c.x+'px'; el.style.top=c.y+'px';

        // 상태에 따른 어두워지기
        const condition = (c.hp/100*0.4) + (c.hunger/100*0.3) + (c.thirst/100*0.3);
        const brightness = 0.3 + condition*0.7;
        const saturation = 0.2 + condition*0.8;
        const bodyEl = el.querySelector('.body');
        bodyEl.style.filter = `brightness(${brightness}) saturate(${saturation})`;

        // 클래스
        if (c.hp<30 && c.stage!=='egg') el.classList.add('dying');
        else el.classList.remove('dying');
        if (c.sleeping) el.classList.add('sleeping');
        else el.classList.remove('sleeping');

        // Zzz 이펙트
        let zzz = el.querySelector('.zzz');
        if (c.sleeping && !zzz) {
            zzz = document.createElement('span');
            zzz.className='zzz'; zzz.textContent='💤';
            zzz.style.left='50%'; zzz.style.top='-5px';
            el.appendChild(zzz);
        } else if (!c.sleeping && zzz) { zzz.remove(); }

        // 필요 표시
        const needsEl = el.querySelector('.needs');
        let needs='';
        if (c.stage!=='egg') {
            if (c.hp<30) needs+='<span class="need-icon" style="font-size:13px">💀</span>';
            if (c.thirst<30 && !c.sleeping) needs+='<span class="need-icon">💧</span>';
            if (c.hunger<30 && !c.sleeping) needs+='<span class="need-icon">🍗</span>';
            if (c.energy<20 && !c.sleeping) needs+='<span class="need-icon">😴</span>';
            if (c.layReady) needs+='<span class="need-icon">🥚</span>';
        }
        needsEl.innerHTML=needs;

        // 바 업데이트
        const growBar = el.querySelector('[data-bar="growth"]');
        const hpBar = el.querySelector('[data-bar="hp"]');
        if (si.growTime) {
            growBar.parentElement.style.display='block';
            growBar.style.width=c.growth+'%';
            growBar.style.background=(c.hunger<=20||c.thirst<=20)?'#f44336':'#4CAF50';
        } else { growBar.parentElement.style.display='none'; }

        if (c.stage!=='egg') {
            hpBar.parentElement.style.display='block';
            hpBar.style.width=c.hp+'%';
            hpBar.style.background=c.hp<30?'#f44336':c.hp<60?'#FF9800':'#4CAF50';
        } else { hpBar.parentElement.style.display='none'; }

        // 방향
        if (c.vx<0) bodyEl.style.transform='scaleX(-1)';
        else if (c.vx>0) bodyEl.style.transform='scaleX(1)';
    });

    if (toRemove.length>0) {
        state.chickens = state.chickens.filter(c => !toRemove.includes(c.id));
        showMsg(`💀 닭 ${toRemove.length}마리가 죽었습니다...`);
    }
    updateUI();
}

// ===== 시작 / 저장 =====
function startGame() {
    document.getElementById('start-screen').style.display='none';
    gameStarted=true;
    buildFence();
    updateUI();
    showMsg('🐔 농장 시작! 병아리를 사보세요!');
}

setInterval(gameLoop, 100);

function saveGame() { localStorage.setItem('chickenGame2', JSON.stringify(state)); }
function loadGame() {
    const s = localStorage.getItem('chickenGame2');
    if (s) {
        try {
            state = JSON.parse(s);
            if (!state.catKills) state.catKills=0;
            state.chickens.forEach(c => {
                if (c.energy===undefined) c.energy=100;
                if (c.sleeping===undefined) c.sleeping=false;
                if (c.collisionCd===undefined) c.collisionCd=0;
                addChickenEl(c);
            });
            updateUI();
            return true;
        } catch(e) {}
    }
    return false;
}
setInterval(saveGame, 5000);

// ===== 코드 시스템 =====
const CODES = {
    '치킨만세': { money:1000, msg:'💰 1,000원!' },
    '부자닭': { money:5000, msg:'💰 5,000원!' },
    '물폭탄': { money:0, thirst:true, msg:'💧 모두에게 물!' },
    '사료대방출': { money:0, hunger:true, msg:'🌾 모두에게 사료!' },
    '풀세트': { money:3000, hunger:true, thirst:true, msg:'🎁 돈 3000 + 풀케어!' },
    '알부자': { eggs:10, msg:'🥚 알 10개!' },
    '치킨이최고': { money:10000, hunger:true, thirst:true, msg:'👑 만원 + 풀케어!' },
};

function openCodeModal() {
    document.getElementById('code-modal').classList.add('show');
    const inp = document.getElementById('code-input'); inp.value=''; inp.focus();
}
function closeCodeModal() { document.getElementById('code-modal').classList.remove('show'); }

function submitCode() {
    const code = document.getElementById('code-input').value.trim();
    if (!code) return;
    const r = CODES[code];
    if (r) {
        if (r.money) state.money += r.money;
        if (r.eggs) state.storedEggs += r.eggs;
        if (r.hunger) state.chickens.forEach(c => { if(c.stage!=='egg') c.hunger=100; });
        if (r.thirst) state.chickens.forEach(c => { if(c.stage!=='egg') c.thirst=100; });
        showMsg(r.msg);
        updateUI();
    } else { showMsg('잘못된 코드!'); }
    closeCodeModal();
}

document.getElementById('code-input').addEventListener('keydown', e => {
    if (e.key==='Enter') submitCode();
    if (e.key==='Escape') closeCodeModal();
});

document.getElementById('start-btn').addEventListener('click', () => {
    loadGame();
    startGame();
});
</script>
