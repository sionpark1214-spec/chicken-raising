<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치킨 키우기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #87CEEB;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        #game {
            width: 100%;
            height: 100vh;
            position: relative;
            background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 40%, #7BC043 40%, #5a9e2f 100%);
        }

        /* 상단 리소스 바 */
        #top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-around;
            padding: 10px 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
        }
        .resource {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .resource-icon { font-size: 18px; }

        /* 울타리 영역 */
        #pen {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border: 6px solid #8B4513;
            border-radius: 12px;
            background: #90C44E;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.1), 0 4px 20px rgba(0,0,0,0.3);
            transition: width 0.5s, height 0.5s;
            overflow: hidden;
        }
        #pen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(0,0,0,0.05) 0%, transparent 40%);
        }

        /* 닭 스프라이트 */
        .chicken {
            position: absolute;
            transition: none;
            cursor: pointer;
            z-index: 10;
        }
        .chicken .body {
            display: block;
            animation: bob 0.8s ease-in-out infinite;
            line-height: 0;
        }
        .chicken .body svg { display: block; }
        .chicken.egg .body { animation: wobble 2s ease-in-out infinite; }
        .chicken.chick .body svg { width: 28px; height: 28px; }
        .chicken.young .body svg { width: 34px; height: 34px; }
        .chicken.adult .body svg { width: 44px; height: 44px; }
        .chicken.egg .body svg { width: 22px; height: 28px; }

        .chicken .needs {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            font-size: 12px;
        }
        .need-icon {
            animation: pulse 1s ease-in-out infinite;
        }

        .chicken .progress-bar {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 2px;
        }
        .chicken .progress-fill {
            height: 100%;
            background: #4CAF50;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .chicken .hp-bar {
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 2px;
        }
        .chicken .hp-fill {
            height: 100%;
            background: #f44336;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .chicken.dying .body {
            animation: shake 0.3s ease-in-out infinite;
            filter: grayscale(0.6);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        @keyframes deathFade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { opacity: 0.6; transform: translateY(-10px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-40px) scale(0.3); }
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 떠오르는 텍스트 */
        .float-text {
            position: absolute;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            z-index: 200;
            animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* 하단 액션 버튼 */
        #bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            gap: 6px;
            padding: 10px 8px;
            justify-content: center;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.3);
            z-index: 100;
        }
        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s, filter 0.1s;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-buy { background: #E91E63; }
        .btn-water { background: #2196F3; }
        .btn-feed { background: #FF9800; }
        .btn-collect { background: #9C27B0; }
        .btn-upgrade { background: #4CAF50; }
        .btn-sell { background: #795548; }
        .btn-code { background: #607D8B; }

        /* 코드 입력 모달 */
        #code-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 400;
            justify-content: center;
            align-items: center;
        }
        #code-modal.show { display: flex; }
        #code-box {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            min-width: 280px;
        }
        #code-box h3 {
            margin-bottom: 12px;
            font-size: 18px;
            color: #333;
        }
        #code-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 12px;
        }
        #code-input:focus { border-color: #607D8B; }
        #code-box .code-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        #code-box .code-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .code-btn-ok { background: #4CAF50; }
        .code-btn-cancel { background: #999; }

        .btn .price {
            font-size: 11px;
            opacity: 0.8;
        }

        /* 메시지 */
        #message {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        #message.show { opacity: 1; }

        /* 울타리 레벨 표시 */
        #pen-label {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            background: #8B4513;
            color: #fff;
            padding: 2px 12px;
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 태양 */
        #sun {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 50px;
            animation: sunPulse 3s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes sunPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 구름 */
        .cloud {
            position: absolute;
            font-size: 40px;
            opacity: 0.7;
            z-index: 1;
            animation: drift 20s linear infinite;
        }
        @keyframes drift {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }

        /* 알 수집 이펙트 */
        .egg-collect {
            position: absolute;
            font-size: 20px;
            z-index: 200;
            animation: eggFly 0.8s ease-in forwards;
        }
        @keyframes eggFly {
            0% { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
        }

        /* 시작 화면 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #FFB347 0%, #FF6B6B 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }
        #start-screen h1 {
            font-size: 48px;
            color: #fff;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        #start-screen .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            margin-bottom: 30px;
        }
        #start-screen .chickens-anim {
            font-size: 60px;
            margin-bottom: 30px;
            animation: bob 1s ease-in-out infinite;
        }
        #start-btn {
            padding: 16px 48px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            background: #fff;
            color: #FF6B6B;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
<div id="game">
    <!-- 시작 화면 -->
    <div id="start-screen">
        <div class="chickens-anim">🐔🐣🥚</div>
        <h1>치킨 키우기</h1>
        <p class="subtitle">병아리부터 키워 나만의 농장을 만들자!</p>
        <button id="start-btn" onclick="startGame()">게임 시작</button>
    </div>

    <!-- 배경 -->
    <div id="sun">☀️</div>
    <div class="cloud" style="top:60px; left:-50px; animation-duration:25s;">☁️</div>
    <div class="cloud" style="top:100px; left:-150px; animation-duration:35s; animation-delay:5s;">☁️</div>
    <div class="cloud" style="top:40px; left:-200px; animation-duration:30s; animation-delay:12s;">☁️</div>

    <!-- 상단 리소스 -->
    <div id="top-bar">
        <div class="resource"><span class="resource-icon">💰</span><span id="money">0</span>원</div>
        <div class="resource"><span class="resource-icon">💧</span><span id="water">0</span></div>
        <div class="resource"><span class="resource-icon">🌾</span><span id="feed">0</span></div>
        <div class="resource"><span class="resource-icon">🥚</span><span id="eggs">0</span></div>
        <div class="resource"><span class="resource-icon">🐔</span><span id="count">0</span>/<span id="max-count">4</span></div>
    </div>

    <!-- 울타리 -->
    <div id="pen">
        <div id="pen-label">울타리 Lv.1</div>
    </div>

    <!-- 메시지 -->
    <div id="message"></div>

    <!-- 하단 버튼 -->
    <div id="bottom-bar">
        <button class="btn btn-buy" onclick="buyChick()">🐣 병아리 사기<span class="price">(100원)</span></button>
        <button class="btn btn-water" onclick="buyWater()">💧 물 사기<span class="price">(30원)</span></button>
        <button class="btn btn-feed" onclick="buyFeed()">🌾 사료 사기<span class="price">(50원)</span></button>
        <button class="btn btn-water" onclick="giveWater()">💧 물 주기</button>
        <button class="btn btn-feed" onclick="giveFeed()">🌾 먹이 주기</button>
        <button class="btn btn-collect" onclick="collectEggs()">🥚 알 수집</button>
        <button class="btn btn-sell" onclick="sellEggs()">🥚 알 팔기<span class="price">(80원)</span></button>
        <button class="btn btn-upgrade" onclick="upgradePen()">🔨 울타리 확장</button>
        <button class="btn btn-code" onclick="openCodeModal()">🔑 코드 입력</button>
    </div>

    <!-- 코드 입력 모달 -->
    <div id="code-modal">
        <div id="code-box">
            <h3>🔑 코드 입력</h3>
            <input type="text" id="code-input" placeholder="코드를 입력하세요" autocomplete="off">
            <div class="code-btns">
                <button class="code-btn code-btn-ok" onclick="submitCode()">확인</button>
                <button class="code-btn code-btn-cancel" onclick="closeCodeModal()">취소</button>
            </div>
        </div>
    </div>
</div>

<script>
function chickenSVG(stage) {
    switch(stage) {
        case 'egg': return `<svg viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="20" cy="28" rx="16" ry="20" fill="#FFF8E7" stroke="#D4A853" stroke-width="1.5"/>
            <ellipse cx="20" cy="28" rx="14" ry="18" fill="#FFFDF0"/>
            <circle cx="14" cy="22" r="2" fill="#E8D5A3" opacity="0.5"/>
            <circle cx="26" cy="32" r="1.5" fill="#E8D5A3" opacity="0.5"/>
            <circle cx="18" cy="36" r="1" fill="#E8D5A3" opacity="0.4"/>
        </svg>`;
        case 'chick': return `<svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
            <!-- 몸 -->
            <ellipse cx="25" cy="32" rx="14" ry="12" fill="#FFD54F"/>
            <ellipse cx="25" cy="32" rx="12" ry="10" fill="#FFE082"/>
            <!-- 머리 -->
            <circle cx="25" cy="18" r="10" fill="#FFD54F"/>
            <circle cx="25" cy="18" r="8.5" fill="#FFE082"/>
            <!-- 눈 -->
            <circle cx="21" cy="16" r="2.5" fill="#333"/>
            <circle cx="21" cy="15" r="1" fill="#fff"/>
            <circle cx="29" cy="16" r="2.5" fill="#333"/>
            <circle cx="29" cy="15" r="1" fill="#fff"/>
            <!-- 부리 -->
            <polygon points="25,20 22,24 28,24" fill="#FF8F00"/>
            <!-- 날개 -->
            <ellipse cx="12" cy="30" rx="5" ry="7" fill="#FFC107" transform="rotate(-10 12 30)"/>
            <ellipse cx="38" cy="30" rx="5" ry="7" fill="#FFC107" transform="rotate(10 38 30)"/>
            <!-- 다리 -->
            <line x1="20" y1="42" x2="18" y2="48" stroke="#FF8F00" stroke-width="2" stroke-linecap="round"/>
            <line x1="30" y1="42" x2="32" y2="48" stroke="#FF8F00" stroke-width="2" stroke-linecap="round"/>
            <!-- 볼 -->
            <circle cx="17" cy="20" r="2" fill="#FFB74D" opacity="0.5"/>
            <circle cx="33" cy="20" r="2" fill="#FFB74D" opacity="0.5"/>
        </svg>`;
        case 'young': return `<svg viewBox="0 0 55 55" xmlns="http://www.w3.org/2000/svg">
            <!-- 몸 -->
            <ellipse cx="28" cy="34" rx="16" ry="14" fill="#FFC107"/>
            <ellipse cx="28" cy="34" rx="14" ry="12" fill="#FFD54F"/>
            <!-- 꼬리 -->
            <path d="M42,28 Q52,20 48,30 Q50,26 44,32" fill="#FF8F00"/>
            <!-- 머리 -->
            <circle cx="28" cy="17" r="11" fill="#FFC107"/>
            <circle cx="28" cy="17" r="9.5" fill="#FFD54F"/>
            <!-- 벼슬 (작게) -->
            <path d="M26,7 Q28,2 30,7" fill="#EF5350"/>
            <!-- 눈 -->
            <circle cx="23" cy="15" r="2.8" fill="#333"/>
            <circle cx="23" cy="14" r="1.2" fill="#fff"/>
            <circle cx="33" cy="15" r="2.8" fill="#333"/>
            <circle cx="33" cy="14" r="1.2" fill="#fff"/>
            <!-- 부리 -->
            <polygon points="28,19 24,24 32,24" fill="#FF6F00"/>
            <!-- 날개 -->
            <ellipse cx="13" cy="32" rx="6" ry="9" fill="#FFA000" transform="rotate(-10 13 32)"/>
            <ellipse cx="43" cy="32" rx="6" ry="9" fill="#FFA000" transform="rotate(10 43 32)"/>
            <!-- 다리 -->
            <line x1="22" y1="46" x2="19" y2="53" stroke="#FF6F00" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="34" y1="46" x2="37" y2="53" stroke="#FF6F00" stroke-width="2.5" stroke-linecap="round"/>
            <!-- 볼 -->
            <circle cx="19" cy="19" r="2.5" fill="#FFB74D" opacity="0.5"/>
            <circle cx="37" cy="19" r="2.5" fill="#FFB74D" opacity="0.5"/>
        </svg>`;
        case 'adult': return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
            <!-- 몸 -->
            <ellipse cx="28" cy="38" rx="18" ry="15" fill="#F5F5F5"/>
            <ellipse cx="28" cy="38" rx="16" ry="13" fill="#FAFAFA"/>
            <!-- 꼬리 깃 -->
            <path d="M44,30 Q56,18 52,28" fill="#4CAF50" opacity="0.9"/>
            <path d="M44,32 Q58,22 54,34" fill="#388E3C" opacity="0.8"/>
            <path d="M44,34 Q54,28 50,38" fill="#66BB6A" opacity="0.7"/>
            <!-- 머리 -->
            <circle cx="28" cy="18" r="12" fill="#F5F5F5"/>
            <circle cx="28" cy="18" r="10.5" fill="#FAFAFA"/>
            <!-- 벼슬 -->
            <path d="M23,7 Q25,0 28,5 Q31,0 33,7" fill="#E53935"/>
            <circle cx="28" cy="6" r="2" fill="#EF5350"/>
            <!-- 눈 -->
            <circle cx="23" cy="16" r="3" fill="#333"/>
            <circle cx="23" cy="15" r="1.3" fill="#fff"/>
            <circle cx="33" cy="16" r="3" fill="#333"/>
            <circle cx="33" cy="15" r="1.3" fill="#fff"/>
            <!-- 부리 -->
            <polygon points="28,20 23,26 33,26" fill="#FF6F00"/>
            <line x1="23" y1="26" x2="33" y2="26" stroke="#E65100" stroke-width="0.5"/>
            <!-- 턱수염 -->
            <ellipse cx="28" cy="28" rx="3" ry="4" fill="#E53935"/>
            <!-- 날개 -->
            <ellipse cx="11" cy="36" rx="7" ry="11" fill="#E0E0E0" transform="rotate(-8 11 36)"/>
            <ellipse cx="45" cy="36" rx="7" ry="11" fill="#E0E0E0" transform="rotate(8 45 36)"/>
            <!-- 날개 무늬 -->
            <path d="M8,30 Q11,34 8,38" stroke="#BDBDBD" fill="none" stroke-width="0.8"/>
            <path d="M48,30 Q45,34 48,38" stroke="#BDBDBD" fill="none" stroke-width="0.8"/>
            <!-- 다리 -->
            <line x1="22" y1="51" x2="18" y2="58" stroke="#FF6F00" stroke-width="3" stroke-linecap="round"/>
            <line x1="34" y1="51" x2="38" y2="58" stroke="#FF6F00" stroke-width="3" stroke-linecap="round"/>
            <!-- 발 -->
            <path d="M15,58 L18,58 L20,56" stroke="#FF6F00" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M35,56 L38,58 L41,58" stroke="#FF6F00" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>`;
    }
}

const STAGES = {
    egg:   { name: '알',     growTime: 8000,  nextStage: 'chick' },
    chick: { name: '병아리', growTime: 15000, nextStage: 'young' },
    young: { name: '중병아리', growTime: 20000, nextStage: 'adult' },
    adult: { name: '성닭',   growTime: null,  nextStage: null }
};

let state = {
    money: 700,
    water: 5,
    feed: 5,
    storedEggs: 0,
    penLevel: 1,
    chickens: [],
    nextId: 0
};

const penSizes = [
    { w: 280, h: 200, max: 4 },
    { w: 360, h: 260, max: 8 },
    { w: 440, h: 320, max: 14 },
    { w: 520, h: 380, max: 22 },
    { w: 600, h: 440, max: 32 },
];
const penUpgradeCost = [0, 300, 800, 2000, 5000];

let gameStarted = false;
let msgTimer = null;

function getPenConfig() {
    return penSizes[Math.min(state.penLevel - 1, penSizes.length - 1)];
}

function showMsg(text) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

function floatText(x, y, text, color = '#fff') {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    document.getElementById('game').appendChild(el);
    setTimeout(() => el.remove(), 1200);
}

function updateUI() {
    document.getElementById('money').textContent = state.money;
    document.getElementById('water').textContent = state.water;
    document.getElementById('feed').textContent = state.feed;
    document.getElementById('eggs').textContent = state.storedEggs;

    const liveCount = state.chickens.filter(c => c.stage !== 'egg' || c.fromHen).length;
    const penCfg = getPenConfig();
    document.getElementById('count').textContent = state.chickens.length;
    document.getElementById('max-count').textContent = penCfg.max;

    const pen = document.getElementById('pen');
    pen.style.width = penCfg.w + 'px';
    pen.style.height = penCfg.h + 'px';
    document.getElementById('pen-label').textContent =
        `울타리 Lv.${state.penLevel} (${state.chickens.length}/${penCfg.max}마리)`;
}

function addChickenEl(chicken) {
    const pen = document.getElementById('pen');
    const penCfg = getPenConfig();

    const el = document.createElement('div');
    el.className = `chicken ${chicken.stage}`;
    el.id = `chicken-${chicken.id}`;
    el.style.left = chicken.x + 'px';
    el.style.top = chicken.y + 'px';

    el.innerHTML = `
        <div class="needs"></div>
        <span class="body">${chickenSVG(chicken.stage)}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
        <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
    `;

    el.addEventListener('click', () => onClickChicken(chicken.id));
    pen.appendChild(el);
}

function createChicken(stage, x, y) {
    const penCfg = getPenConfig();
    const id = state.nextId++;
    const chicken = {
        id,
        stage,
        x: x ?? Math.random() * (penCfg.w - 50) + 10,
        y: y ?? Math.random() * (penCfg.h - 60) + 20,
        hunger: 100,
        thirst: 100,
        hp: 100,
        growth: 0,
        eggTimer: 0,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        layReady: false,
        fromHen: false
    };
    state.chickens.push(chicken);
    addChickenEl(chicken);
    return chicken;
}

function onClickChicken(id) {
    const c = state.chickens.find(ch => ch.id === id);
    if (!c) return;
    const info = STAGES[c.stage];
    let status = `${info.name}`;
    if (c.stage !== 'adult') {
        status += ` | 성장: ${Math.floor(c.growth)}%`;
    }
    status += ` | ❤️${Math.floor(c.hp)}% | 🍗${Math.floor(c.hunger)}% | 💧${Math.floor(c.thirst)}%`;
    if (c.layReady) status += ' | 🥚 알 수집 가능!';
    showMsg(status);
}

function buyChick() {
    if (state.money < 100) return showMsg('돈이 부족합니다!');
    const penCfg = getPenConfig();
    if (state.chickens.length >= penCfg.max) return showMsg('울타리가 꽉 찼습니다! 확장하세요.');
    state.money -= 100;
    createChicken('chick');
    showMsg('🐣 병아리를 샀습니다!');
    updateUI();
}

function buyWater() {
    if (state.money < 30) return showMsg('돈이 부족합니다!');
    state.money -= 30;
    state.water += 5;
    showMsg('💧 물 5개 구매!');
    updateUI();
}

function buyFeed() {
    if (state.money < 50) return showMsg('돈이 부족합니다!');
    state.money -= 50;
    state.feed += 5;
    showMsg('🌾 사료 5개 구매!');
    updateUI();
}

function giveWater() {
    if (state.water <= 0) return showMsg('물이 없습니다! 먼저 구매하세요.');
    const thirsty = state.chickens.filter(c => c.thirst < 80 && c.stage !== 'egg');
    if (thirsty.length === 0) return showMsg('목마른 닭이 없습니다!');
    const count = Math.min(state.water, thirsty.length);
    for (let i = 0; i < count; i++) {
        thirsty[i].thirst = Math.min(100, thirsty[i].thirst + 40);
        const el = document.getElementById(`chicken-${thirsty[i].id}`);
        if (el) {
            const rect = el.getBoundingClientRect();
            floatText(rect.left, rect.top - 10, '💧', '#2196F3');
        }
    }
    state.water -= count;
    showMsg(`💧 ${count}마리에게 물을 줬습니다!`);
    updateUI();
}

function giveFeed() {
    if (state.feed <= 0) return showMsg('사료가 없습니다! 먼저 구매하세요.');
    const hungry = state.chickens.filter(c => c.hunger < 80 && c.stage !== 'egg');
    if (hungry.length === 0) return showMsg('배고픈 닭이 없습니다!');
    const count = Math.min(state.feed, hungry.length);
    for (let i = 0; i < count; i++) {
        hungry[i].hunger = Math.min(100, hungry[i].hunger + 40);
        const el = document.getElementById(`chicken-${hungry[i].id}`);
        if (el) {
            const rect = el.getBoundingClientRect();
            floatText(rect.left, rect.top - 10, '🌾', '#FF9800');
        }
    }
    state.feed -= count;
    showMsg(`🌾 ${count}마리에게 먹이를 줬습니다!`);
    updateUI();
}

function collectEggs() {
    const layers = state.chickens.filter(c => c.layReady);
    if (layers.length === 0) return showMsg('수집할 알이 없습니다!');

    let collected = 0;
    layers.forEach(c => {
        c.layReady = false;
        c.eggTimer = 0;
        collected++;

        const penCfg = getPenConfig();
        if (state.chickens.length < penCfg.max && Math.random() < 0.5) {
            const egg = createChicken('egg', c.x + 15, c.y + 15);
            egg.fromHen = true;
        } else {
            state.storedEggs++;
        }
    });

    showMsg(`🥚 알 ${collected}개 수집! (일부는 부화 중)`);
    updateUI();
}

function sellEggs() {
    if (state.storedEggs <= 0) return showMsg('팔 알이 없습니다!');
    const earn = state.storedEggs * 80;
    state.money += earn;
    showMsg(`🥚 알 ${state.storedEggs}개를 ${earn}원에 팔았습니다!`);
    state.storedEggs = 0;
    updateUI();
}

function upgradePen() {
    if (state.penLevel >= penSizes.length) return showMsg('최대 레벨입니다!');
    const cost = penUpgradeCost[state.penLevel];
    if (state.money < cost) return showMsg(`돈이 부족합니다! (${cost}원 필요)`);
    state.money -= cost;
    state.penLevel++;
    showMsg(`🔨 울타리를 Lv.${state.penLevel}로 확장했습니다!`);
    updateUI();
}

function gameLoop() {
    if (!gameStarted) return;
    const dt = 100;
    const penCfg = getPenConfig();

    const toRemove = [];

    state.chickens.forEach(c => {
        // 이동 (죽어가는 닭은 느리게)
        if (c.stage !== 'egg') {
            const speedMult = c.hp < 30 ? 0.3 : 1;
            if (Math.random() < 0.02) {
                c.vx = (Math.random() - 0.5) * 1.0 * speedMult;
                c.vy = (Math.random() - 0.5) * 1.0 * speedMult;
            }
            c.x += c.vx * speedMult;
            c.y += c.vy * speedMult;
            c.x = Math.max(5, Math.min(penCfg.w - 45, c.x));
            c.y = Math.max(20, Math.min(penCfg.h - 50, c.y));
            if (c.x <= 5 || c.x >= penCfg.w - 45) c.vx *= -1;
            if (c.y <= 20 || c.y >= penCfg.h - 50) c.vy *= -1;
        }

        // 허기/갈증 감소 (~20분에 0까지)
        if (c.stage !== 'egg') {
            c.hunger = Math.max(0, c.hunger - 0.008);
            c.thirst = Math.max(0, c.thirst - 0.01);
        }

        // HP 감소: 허기 or 갈증이 0이면 체력이 줄어듦 (~40분에 0)
        if (c.stage !== 'egg') {
            let hpLoss = 0;
            if (c.hunger <= 0) hpLoss += 0.004;
            if (c.thirst <= 0) hpLoss += 0.004;
            if (hpLoss > 0) {
                c.hp = Math.max(0, c.hp - hpLoss);
            } else if (c.hunger > 50 && c.thirst > 50) {
                c.hp = Math.min(100, c.hp + 0.002);
            }
        }

        // 죽음 처리
        if (c.hp <= 0 && c.stage !== 'egg') {
            const el = document.getElementById(`chicken-${c.id}`);
            if (el) {
                el.style.animation = 'deathFade 1s ease-out forwards';
                el.style.pointerEvents = 'none';
                const rect = el.getBoundingClientRect();
                floatText(rect.left, rect.top - 20, '💀 죽었습니다...', '#f44336');
                setTimeout(() => el.remove(), 1000);
            }
            toRemove.push(c.id);
            return;
        }

        // 성장
        const stageInfo = STAGES[c.stage];
        if (stageInfo.growTime && c.hunger > 20 && c.thirst > 20) {
            c.growth += (dt / stageInfo.growTime) * 100;
            if (c.growth >= 100) {
                c.stage = stageInfo.nextStage;
                c.growth = 0;
                c.hp = 100;
                const el = document.getElementById(`chicken-${c.id}`);
                if (el) {
                    el.className = `chicken ${c.stage}`;
                    el.querySelector('.body').innerHTML = chickenSVG(c.stage);
                    const rect = el.getBoundingClientRect();
                    floatText(rect.left, rect.top - 20, '⬆️ 성장!', '#FFD700');
                }
            }
        }

        // 성닭 알 낳기
        if (c.stage === 'adult' && !c.layReady && c.hunger > 30 && c.thirst > 30 && c.hp > 30) {
            c.eggTimer += dt;
            if (c.eggTimer >= 12000) {
                c.layReady = true;
                const el = document.getElementById(`chicken-${c.id}`);
                if (el) {
                    const rect = el.getBoundingClientRect();
                    floatText(rect.left, rect.top - 20, '🥚 알 낳음!', '#9C27B0');
                }
            }
        }

        // UI 업데이트
        const el = document.getElementById(`chicken-${c.id}`);
        if (el) {
            el.style.left = c.x + 'px';
            el.style.top = c.y + 'px';

            // dying 클래스
            if (c.hp < 30 && c.stage !== 'egg') {
                el.classList.add('dying');
            } else {
                el.classList.remove('dying');
            }

            // 필요 표시
            const needsEl = el.querySelector('.needs');
            let needs = '';
            if (c.stage !== 'egg') {
                if (c.hp < 30) needs += '<span class="need-icon" style="font-size:14px">💀</span>';
                if (c.thirst < 30) needs += '<span class="need-icon">💧</span>';
                if (c.hunger < 30) needs += '<span class="need-icon">🌾</span>';
                if (c.layReady) needs += '<span class="need-icon">🥚</span>';
            }
            needsEl.innerHTML = needs;

            // 성장 바
            const fill = el.querySelector('.progress-fill');
            if (STAGES[c.stage].growTime) {
                el.querySelector('.progress-bar').style.display = 'block';
                fill.style.width = c.growth + '%';
                if (c.hunger <= 20 || c.thirst <= 20) {
                    fill.style.background = '#f44336';
                } else {
                    fill.style.background = '#4CAF50';
                }
            } else {
                el.querySelector('.progress-bar').style.display = 'none';
            }

            // HP 바
            const hpFill = el.querySelector('.hp-fill');
            if (c.stage !== 'egg') {
                el.querySelector('.hp-bar').style.display = 'block';
                hpFill.style.width = c.hp + '%';
                if (c.hp < 30) hpFill.style.background = '#f44336';
                else if (c.hp < 60) hpFill.style.background = '#FF9800';
                else hpFill.style.background = '#4CAF50';
            } else {
                el.querySelector('.hp-bar').style.display = 'none';
            }

            // 방향에 따라 뒤집기
            const bodyEl = el.querySelector('.body');
            if (c.vx < 0) {
                bodyEl.style.transform = 'scaleX(-1)';
            } else if (c.vx > 0) {
                bodyEl.style.transform = 'scaleX(1)';
            }
        }
    });

    if (toRemove.length > 0) {
        state.chickens = state.chickens.filter(c => !toRemove.includes(c.id));
        if (toRemove.length === 1) showMsg('💀 닭 1마리가 죽었습니다...');
        else showMsg(`💀 닭 ${toRemove.length}마리가 죽었습니다...`);
    }

    updateUI();
}

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    gameStarted = true;
    updateUI();
    showMsg('🐔 농장 생활을 시작합니다! 병아리를 사보세요!');
}

setInterval(gameLoop, 100);

// 자동 저장
function saveGame() {
    localStorage.setItem('chickenGame', JSON.stringify(state));
}
function loadGame() {
    const saved = localStorage.getItem('chickenGame');
    if (saved) {
        try {
            const loaded = JSON.parse(saved);
            state = loaded;
            const pen = document.getElementById('pen');
            state.chickens.forEach(c => addChickenEl(c));
            updateUI();
            return true;
        } catch(e) {}
    }
    return false;
}

setInterval(saveGame, 5000);

const CODES = {
    '치킨만세': { money: 1000, msg: '💰 1,000원 획득!' },
    '부자닭': { money: 5000, msg: '💰 5,000원 획득!' },
    '물폭탄': { water: 20, msg: '💧 물 20개 획득!' },
    '사료대방출': { feed: 20, msg: '🌾 사료 20개 획득!' },
    '풀세트': { money: 3000, water: 15, feed: 15, msg: '🎁 돈 3000 + 물 15 + 사료 15 획득!' },
    '알부자': { eggs: 10, msg: '🥚 알 10개 획득!' },
    '치킨이최고': { money: 10000, water: 30, feed: 30, msg: '👑 만원 + 물 30 + 사료 30 대박!' },
};
const usedCodes = new Set();

function openCodeModal() {
    document.getElementById('code-modal').classList.add('show');
    const input = document.getElementById('code-input');
    input.value = '';
    input.focus();
}

function closeCodeModal() {
    document.getElementById('code-modal').classList.remove('show');
}

function submitCode() {
    const input = document.getElementById('code-input');
    const code = input.value.trim();
    if (!code) return;

    if (usedCodes.has(code)) {
        showMsg('이미 사용한 코드입니다!');
        closeCodeModal();
        return;
    }

    const reward = CODES[code];
    if (reward) {
        usedCodes.add(code);
        if (reward.money) state.money += reward.money;
        if (reward.water) state.water += reward.water;
        if (reward.feed) state.feed += reward.feed;
        if (reward.eggs) state.storedEggs += reward.eggs;
        showMsg(reward.msg);
        updateUI();
    } else {
        showMsg('잘못된 코드입니다!');
    }
    closeCodeModal();
}

document.getElementById('code-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitCode();
    if (e.key === 'Escape') closeCodeModal();
});

document.getElementById('start-btn').addEventListener('click', () => {
    if (!loadGame()) {
        state.money = 500;
        state.water = 5;
        state.feed = 5;
    }
});
</script>
